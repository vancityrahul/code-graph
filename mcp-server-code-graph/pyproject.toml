[project]
name = "code-graph-mcp"
version = "0.1.0"
description = "MCP server exposing code graph queries over a tree-sitter + Kùzu index"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "kuzu>=0.7.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "watchdog>=4.0.0",
]

[project.scripts]
code-graph-mcp = "code_graph_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_graph_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
